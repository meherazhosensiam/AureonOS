# ============================================================
# AUREON OS - Canonical Project Configuration
# ============================================================
# This is the SINGLE SOURCE OF TRUTH for project identity and version.
# Change values here, then rebuild. All user-facing branding derives from this.
#
# DO NOT edit generated files directly. They are created at build time
# from templates using these values.
# ============================================================

# ---- Display Identity ---------------------------------------
# Human-readable project name (used in installer, About, ISO label, etc.)
PROJECT_NAME="AUREON OS"

# Short identifier used in filenames, paths, package names (lowercase, no spaces)
# Changing this requires manual migration of filesystem paths.
PROJECT_ID="aureonos"

# Username for live session (typically shorter than PROJECT_ID)
PROJECT_USERNAME="aureon"

# ---- Version ------------------------------------------------
# Project version. Change this for each release.
PROJECT_VERSION="1.0"

# Optional codename (for DEBIAN_CODENAME compatibility)
PROJECT_CODENAME="aureon"

# ---- Metadata -----------------------------------------------
PROJECT_DESCRIPTION="A Debian-based cybersecurity learner operating system"
PROJECT_VENDOR="AUREON Project"
PROJECT_HOME_URL="https://aureon-os.local"
PROJECT_SUPPORT_URL="https://aureon-os.local"
PROJECT_BUG_URL="https://aureon-os.local"

# ---- Base Distribution --------------------------------------
BASE_DISTRIBUTION="trixie"
BASE_DISTRIBUTION_CODENAME="trixie"

# ---- Derived Values (computed at build time, do not edit) ---
# ISO_VOLUME="${PROJECT_NAME// /}"           # e.g., "AUREONOS"
# ISO_FILENAME="${PROJECT_ID}-${PROJECT_VERSION}-${ARCH}.iso"
# BOOT_USERNAME="${PROJECT_ID}"              # e.g., "aureon"
# HOSTNAME="${PROJECT_ID}"                   # e.g., "aureonos"