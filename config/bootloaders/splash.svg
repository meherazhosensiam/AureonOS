<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480">
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#1c1420"/>
      <stop offset="55%" stop-color="#100d16"/>
      <stop offset="100%" stop-color="#0a0910"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e01b37"/>
      <stop offset="100%" stop-color="#ff5a4e"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="640" height="480" fill="url(#glow)"/>

  <!-- logo mark: hexagonal shield -->
  <g transform="translate(320,150)">
    <path d="M -46 -80 L 46 -80 L 92 0 L 46 80 L -46 80 L -92 0 Z"
          fill="none" stroke="url(#accent)" stroke-width="5" stroke-linejoin="round" opacity="0.9"/>
    <path d="M -30 -52 L 30 -52 L 60 0 L 30 52 L -30 52 L -60 0 Z"
          fill="#e01b37" opacity="0.14"/>
    <text x="0" y="18" text-anchor="middle" font-family="DejaVu Sans, sans-serif"
          font-size="64" font-weight="bold" fill="#ffffff">A</text>
  </g>

  <!-- wordmark -->
  <text x="320" y="300" text-anchor="middle" font-family="DejaVu Sans, sans-serif"
        font-size="44" font-weight="bold" letter-spacing="10" fill="#ffffff">AUREON<tspan fill="#e01b37">OS</tspan></text>

  <!-- accent underline -->
  <rect x="220" y="318" width="200" height="3" rx="1.5" fill="url(#accent)"/>

  <!-- footer -->
  <text x="320" y="420" text-anchor="middle" font-family="DejaVu Sans, sans-serif"
        font-size="15" fill="#8d8d98">AUREON OS 1.0 (amd64)</text>
</svg>
