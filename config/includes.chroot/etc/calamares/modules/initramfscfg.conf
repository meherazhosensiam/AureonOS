# Initramfs configuration for Calamares (AUREON OS)
# =================================================
# Configures initramfs regeneration on the installed system.
# This module copies necessary initramfs hooks (e.g., for LUKS encryption)
# and ensures update-initramfs runs on the target.
#
# For AUREON OS (no LUKS by default), no special hooks are needed.
# The module will still run update-initramfs to ensure the initramfs
# is properly generated for the target hardware.
#
# The module is part of the exec sequence in settings.conf.

---