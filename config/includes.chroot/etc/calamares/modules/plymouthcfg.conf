# Plymouth theme configuration for Calamares (AUREON OS)
# ======================================================
# Sets the AUREON OS Plymouth theme on the installed system.
# This module runs during the Calamares installation phase (exec).
#
# The theme must be installed in the target system at:
#   /usr/share/plymouth/themes/aureon/
# This is ensured because Calamares unpackfs copies the entire
# live filesystem (including /usr/share/plymouth/themes/aureon/)
# to the target.
#
# The module calls: plymouth-set-default-theme "aureon"
# inside the target chroot.

---
plymouth_theme: "aureon"