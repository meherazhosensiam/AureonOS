# AUREON OS - kernel performance tuning
# Applied to both the live session and the installed system.

# Prefer keeping RAM for applications rather than disk cache
vm.swappiness = 10
vm.vfs_cache_pressure = 50

# Larger network buffers for high-throughput analysis workloads
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216

# Reduce console log noise
kernel.printk = 3 3 3 3
